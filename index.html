<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=1050" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="application-name" content="SafeScan Brasil" />
    <meta
      name="description"
      content="SafeScan Brasil - Sistema de gestão SST com QR Code, documentos, treinamentos e auditorias."
    />
    <link rel="canonical" href="https://www.safescanbrasil.com.br/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SafeScan Brasil" />
    <meta property="og:title" content="SafeScan Brasil | Gestão de SST" />
    <meta property="og:description" content="Gestão de SST com QR Code, documentos, treinamentos e auditorias." />
    <meta property="og:url" content="https://www.safescanbrasil.com.br/" />
    <title>SafeScan Brasil</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #f1f5f9;
      }

      #app-bootstrap-shell {
        box-sizing: border-box;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
        background: linear-gradient(135deg, #f1f5f9, #ffffff, #e2e8f0);
      }

      #app-bootstrap-card {
        box-sizing: border-box;
        width: min(100%, 448px);
        padding: 24px;
        color: #ffffff;
        border-radius: 32px;
        background: #020617;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
      }

      #app-bootstrap-content {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      #app-bootstrap-icon {
        width: 36px;
        height: 36px;
        flex: 0 0 auto;
        object-fit: contain;
      }

      #app-bootstrap-brand {
        margin: 0;
        color: #cffafe;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      #app-bootstrap-message {
        margin: 4px 0 0;
        color: #ffffff;
        font-size: 16px;
        font-weight: 800;
      }

      #app-bootstrap-subtitle {
        margin: 4px 0 0;
        color: #cbd5e1;
        font-size: 12px;
        line-height: 1.5;
      }

      #app-bootstrap-progress {
        height: 6px;
        margin-top: 20px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
      }

      #app-bootstrap-progress::before {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #a5f3fc;
        content: "";
        animation: app-bootstrap-progress 1.5s ease-in-out infinite;
      }

      @keyframes app-bootstrap-progress {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(280%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-bootstrap-progress::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-bootstrap-shell" role="status" aria-live="polite">
        <div id="app-bootstrap-card">
          <div id="app-bootstrap-content">
            <img id="app-bootstrap-icon" src="/favicon.png?v=1050" alt="SafeScan Brasil" />
            <div>
              <p id="app-bootstrap-brand">SafeScan Brasil</p>
              <p id="app-bootstrap-message">Carregando sistema...</p>
              <p id="app-bootstrap-subtitle">Validando sua sessao e preparando o ambiente.</p>
            </div>
          </div>
          <div id="app-bootstrap-progress" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
