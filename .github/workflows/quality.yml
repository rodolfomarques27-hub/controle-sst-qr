name: Qualidade

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Baixar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar qualidade, seguranca e build
        run: npm run verify
      - name: Executar testes unitarios e de logica
        run: npm run test:unit
      - name: Executar regressao Node
        run: npm run test:regression
      - name: Instalar Chromium do Playwright
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Executar testes E2E locais
        run: npm run test:e2e
